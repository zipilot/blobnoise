name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@zipilot"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:package
      - name: Publish the version from package.json
        run: npm publish --workspace @zipilot/blobnoise
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install and verify the actual registry package
        run: node scripts/verify-published.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
