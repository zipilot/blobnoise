name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify an existing version without publishing it again
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@alejo-valencia"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:package
      - name: Publish the version from package.json
        if: ${{ !inputs.verify_only }}
        run: npm publish --workspace @alejo-valencia/blobnoise
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install and verify the actual registry package
        run: node scripts/verify-published.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report package identity and visibility
        run: gh api users/alejo-valencia/packages/npm/blobnoise --jq '{name,visibility,html_url,repository:.repository.full_name}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
